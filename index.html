<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description"
    content="Create custom QR codes instantly with URL, text, and Wi-Fi support. Export as PNG, WebP, or SVG with logo, color, size, and style controls." />
  <meta name="keywords"
    content="QR code generator, custom QR code, Wi-Fi QR code, URL QR code, text QR code, QR PNG, QR SVG, QR WebP" />
  <meta name="robots" content="index, follow, max-image-preview:large" />

    content="Generate beautiful QR codes for URLs, text, and Wi-Fi. Customize colors, gradients, corners, and logos, then export in PNG, WebP, or SVG." />

  <meta name="twitter:image"
    content="https://github.com/AbhinavTheDev/qr-code-generator/assets/85792055/e963b071-7ab7-4a15-9416-70bdac1d8b61" />

    type="image/x-icon">
  <title>QR Code Generator | Create Custom QR Codes Online</title>
  <link rel="stylesheet" href="style.css" />
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "QR Code Generator",
      "applicationCategory": "UtilitiesApplication",
      "operatingSystem": "Any",
      "url": "https://abhinavthedev.github.io/qr-code-generator/",
      "description": "Create custom QR codes for URLs, text, and Wi-Fi with color, gradient, logo, and export options.",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "featureList": [
        "URL QR code generation",
        "Text QR code generation",
        "Wi-Fi QR code generation",
        "PNG, WebP, and SVG export",
        "Color and gradient customization",
        "Logo upload"
      ]
    }
  </script>
  <!-- Iconify Icons -->
  <script src="https://code.iconify.design/iconify-icon/1.0.8/iconify-icon.min.js"></script>
  <!-- Modern generator with styling options -->
  <script src="https://cdn.jsdelivr.net/npm/qr-code-styling@1.6.0-rc.1/lib/qr-code-styling.js" defer></script>
  <script type="module" src="script.js" defer></script>

<body>
  <header class="app-header">
    <h1 class="app-title">QR Code</h1>
    <div class="header-actions">
      <iframe src="https://github.com/sponsors/AbhinavTheDev/button" title="Sponsor AbhinavTheDev" height="32"
        width="114" style="border: 0; border-radius: 6px"></iframe>
      <button id="themeToggle" class="icon-btn" type="button" aria-label="Toggle theme"></button>
    </div>
  </header>

  <main class="app">
    <section class="layout">
      <!-- Controls -->
      <form id="qrForm" class="panel" novalidate>
        <div class="panel-header">
          <h2 class="panel-title">Customize</h2>
        </div>

        <div class="field">
          <div class="tabs" role="tablist" aria-label="Content type">
            <button class="tab is-active" data-type="url" type="button" role="tab" aria-selected="true">
              URL
            </button>
            <button class="tab" data-type="text" type="button" role="tab" aria-selected="false">
              Text
            </button>
            <button class="tab" data-type="wifi" type="button" role="tab" aria-selected="false">
              Wi‑Fi
            </button>
          </div>

          <div id="content-url" class="content is-active">
            <label for="url">URL</label>
            <input id="url" name="url" type="url" inputmode="url" placeholder="https://example.com" autocomplete="url"
              required aria-describedby="urlHelp urlError" />
            <!-- <div id="urlHelp" class="help">
              If no scheme is given, https:// will be added.
            </div> -->
            <div id="urlError" class="error" role="alert" aria-live="polite"></div>
          </div>

          <div id="content-text" class="content">
            <label for="plainText">Text</label>
            <textarea id="plainText" rows="3" placeholder="Any text..."></textarea>
          </div>

          <div id="content-wifi" class="content">
            <div class="grid-2">
              <div class="field">
                <label for="wifiSsid">SSID</label>
                <input id="wifiSsid" type="text" placeholder="Network name" />
              </div>
              <div class="field">
                <label for="wifiAuth">Encryption</label>
                <select id="wifiAuth">
                  <option value="WPA" selected>WPA/WPA2</option>
                  <option value="WEP">WEP</option>
                  <option value="nopass">None</option>
                </select>
              </div>
            </div>
            <div class="grid-2">
              <div class="field">
                <label for="wifiPass">Password</label>
                <input id="wifiPass" type="text" placeholder="••••••••" />
              </div>
              <div class="row between">
                <label for="wifiHidden">Hidden</label>
                <input id="wifiHidden" type="checkbox" />
              </div>
            </div>
          </div>
        </div>

        <div class="grid-2">
          <!-- General options (stay visible) -->
          <div class="field">
            <label for="size">Size</label>
            <select id="size" name="size">
              <option value="192">192 px</option>
              <option value="256" selected>256 px</option>
              <option value="384">384 px</option>
              <option value="512">512 px</option>
              <option value="640">640 px</option>
            </select>
          </div>

          <div class="field">
            <label for="exportScale">Export scale</label>
            <select id="exportScale" name="exportScale">
              <option value="1">1x</option>
              <option value="2" selected>2x</option>
              <option value="4">4x</option>
              <option value="8">8x</option>
            </select>
          </div>

          <div class="field">
            <label>Foreground</label>
            <div class="color-radio-group" id="fgColorGroup">
              <button type="button" class="color-none-btn" title="No color">
                <iconify-icon icon="maki:cross" width="15" height="15"></iconify-icon>
              </button>
              <div class="swatches" data-target="fg">
                <button type="button" style="--c: #000000" title="Black"></button>
                <button type="button" style="--c: #123456" title="Dark gray"></button>
                <button type="button" style="--c: #2563eb" title="Blue"></button>
              </div>
              <button type="button" class="color-palette-btn" title="Pick color">
                <iconify-icon icon="ic:baseline-color-lens" width="24" height="24"></iconify-icon>
                <input id="fg" type="color" name="foreground" value="#e66465" />
              </button>
            </div>
          </div>

          <div class="field">
            <label>Background</label>
            <div class="color-radio-group" id="bgColorGroup">
              <button type="button" class="color-none-btn" id="bgNone" title="Transparent">
                <iconify-icon icon="maki:cross" width="15" height="15"></iconify-icon>
              </button>
              <div class="swatches" data-target="bg">
                <button type="button" style="--c: #ffffff" title="White"></button>
                <button type="button" style="--c: #00ff00" title="green"></button>
                <button type="button" style="--c: #ff0000" title="red"></button>
              </div>
              <button type="button" class="color-palette-btn" title="Pick color">
                <iconify-icon icon="ic:baseline-color-lens" width="24" height="24"></iconify-icon>
                <input id="bg" type="color" value="#ffffff" />
              </button>
            </div>
          </div>
        </div>

        <!-- Advanced options (collapsed by default) -->
        <details id="advanced" class="advanced">
          <summary>Advanced options</summary>
          <div class="advanced-grid grid-2">
            <div class="field">
              <label for="ecc">Error correction</label>
              <select id="ecc" name="ecc">
                <option value="L">Low (L)</option>
                <option value="M">Medium (M)</option>
                <option value="Q">Quartile (Q)</option>
                <option value="H" selected>High (H)</option>
              </select>
            </div>

            <div class="field">
              <label for="margin">Quiet zone</label>
              <input id="margin" type="number" min="0" max="60" value="8" />
            </div>

            <div class="field">
              <label for="dotsType">Dots style</label>
              <select id="dotsType">
                <option value="square" selected>Square</option>
                <option value="dots">Dots</option>
                <option value="rounded">Rounded</option>
                <option value="classy">Classy</option>
                <option value="classy-rounded">Classy Rounded</option>
                <option value="extra-rounded">Extra Rounded</option>
              </select>
            </div>

            <div class="field">
              <label for="cornerType">Corner style</label>
              <select id="cornerType">
                <option value="square" selected>Square</option>
                <option value="dot">Dot</option>
                <option value="extra-rounded">Extra Rounded</option>
              </select>
            </div>

            <div class="field">
              <label>Gradient</label>
              <div class="">
                <div class="field">
                  <label>From</label>
                  <div class="color-radio-group" id="gradFromGroup">
                    <button type="button" class="color-none-btn" title="No color">
                      <iconify-icon icon="maki:cross" width="15" height="15"></iconify-icon>
                    </button>
                    <div class="swatches" data-target="gradFrom" style="margin-left: 4px;">
                      <button type="button" style="--c: #000000" title="Black"></button>
                      <button type="button" style="--c: #2563eb" title="Blue"></button>
                      <button type="button" style="--c: #059669" title="Green"></button>
                    </div>
                    <button type="button" class="color-palette-btn" title="Pick color">
                      <iconify-icon icon="ic:baseline-color-lens" width="24" height="24"></iconify-icon>
                      <input id="gradFrom" type="color" value="#000000" />
                    </button>
                  </div>
                </div>
                <div class="field">
                  <label>To</label>
                  <div class="color-radio-group" id="gradToGroup">
                    <button type="button" class="color-none-btn" title="No color">
                      <iconify-icon icon="maki:cross" width="15" height="15"></iconify-icon>
                    </button>
                    <div class="swatches" data-target="gradTo" style="margin-left: 4px;">
                      <button type="button" style="--c: #6366f1" title="Indigo"></button>
                      <button type="button" style="--c: #0ea5e9" title="Cyan"></button>
                      <button type="button" style="--c: #f59e0b" title="Amber"></button>
                    </div>
                    <button type="button" class="color-palette-btn" title="Pick color">
                      <iconify-icon icon="ic:baseline-color-lens" width="24" height="24"></iconify-icon>
                      <input id="gradTo" type="color" value="#6366f1" />
                    </button>
                  </div>
                </div>
              </div>
              <!-- <div class="field">
                <label for="gradAngle">Angle</label>
                <input id="gradAngle" type="range" min="0" max="360" value="45" />
              </div> -->
            </div>

            <div class="field">
              <label for="logoFile">Logo</label>
              <div class="logo-upload-wrapper">
                <input id="logoFile" type="file" accept="image/*" class="logo-file-input" />
                <div class="logo-preview" id="logoPreview">
                  <div class="logo-upload-prompt">
                    <iconify-icon icon="mdi-light:image" width="30" height="30"></iconify-icon>
                    <span>Click to upload logo</span>
                  </div>
                </div>
                <button id="clearLogoBtn" type="button" class="clear-logo-btn" style="display: none;">
                  <iconify-icon icon="streamline-ultimate:bin-1-bold" width="18" height="18"
                    style="color: #f00"></iconify-icon>
                </button>
              </div>
            </div>

            <div class="field">
              <label for="logoSize">Logo size</label>
              <input id="logoSize" type="range" min="8" max="40" value="22" />
              <div class="help"><span id="logoSizeVal">22</span>% of QR</div>
            </div>

            <div class="field">
              <label for="logoRadius">Logo radius</label>
              <input id="logoRadius" type="range" min="0" max="24" value="8" />
              <div class="help"><span id="logoRadiusVal">8</span> px</div>
            </div>
          </div>
        </details>

        <div class="actions">
          <button id="previewGenerateBtn" class="btn" type="submit">Generate</button>
          <button id="resetBtn" class="btn btn-ghost" type="button">
            Reset
          </button>
        </div>
      </form>

      <div class="outputs">
        <!-- Preview -->
        <aside class="panel preview-panel">
          <div class="panel-header">
            <h2 class="panel-title">Preview</h2>
            <div class="preview-actions">
              <button id="previewCopyBtn" class="btn btn-ghost" type="button" disabled>Copy</button>
              <div class="download-dropdown">
                <button id="previewDownloadBtn" class="btn btn-primary" type="button" disabled>
                  Download
                  <iconify-icon icon="fluent:chevron-down-24-regular" width="16" height="16"
                    style="margin-left: 4px;"></iconify-icon>
                </button>
                <div class="dropdown-menu" id="downloadMenu">
                  <button id="previewDownloadPng" class="dropdown-item" type="button">PNG (Default)</button>
                  <button id="previewDownloadWebp" class="dropdown-item" type="button">WebP</button>
                  <button id="previewDownloadSvg" class="dropdown-item" type="button">SVG</button>
                </div>
              </div>
            </div>
          </div>
          <div class="preview">
            <div id="qrContainer" class="qr-box" aria-live="polite" aria-label="QR preview"></div>
          </div>
          <!-- <div class="preview-hint help">
            Preview auto-scales to fit. Exports honor “Export scale”.
          </div> -->

        </aside>

        <div class="extra-div"></div>
      </div>
    </section>
  </main>

    <div class="site-footer-inner">
      <div class="footer-left">
        <div class="footer-brand">
          <iconify-icon icon="ic:baseline-qr-code" width="24" height="24"></iconify-icon>

        </div>

      </div>

            </a>
          </li>

    </div>
