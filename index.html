<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description"
        content="Create custom QR codes instantly with URL, text, and Wi-Fi support. Export as PNG, WebP, or SVG with logo, color, size, and style controls." />
    <meta name="theme-color" content="#07100c" />
    <title>QuickScan | QR Generator</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://code.iconify.design/iconify-icon/1.0.8/iconify-icon.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qr-code-styling@1.6.0-rc.1/lib/qr-code-styling.js" defer></script>
    <script type="module" src="script.js" defer></script>
</head>

<body>
    <div class="page-aura" aria-hidden="true"></div>

    <header class="app-header">
        <a class="brand" href="index.html">QuickScan</a>
        <button id="themeToggle" class="icon-btn" type="button" aria-label="Toggle theme"></button>
    </header>

    <main class="app">
        <section class="hero-block">
            <h1>Instant QR Codes: Convert <span>Anything, Anywhere.</span></h1>
            <p>Design and share polished QR codes with a focused workspace and fast generation.</p>
        </section>

        <form id="qrForm" class="generator-shell" novalidate>
            <div class="generator-grid">
                <aside class="type-rail" aria-label="Content type">
                    <button class="tab is-active" data-type="url" type="button" role="tab"
                        aria-selected="true">URL</button>
                    <button class="tab" data-type="text" type="button" role="tab" aria-selected="false">Text</button>
                    <button class="tab" data-type="wifi" type="button" role="tab" aria-selected="false">WiFi</button>
                </aside>

                <section class="stage-panel" aria-live="polite">
                    <div class="stage-content">
                        <h2>Enter your website URL here...</h2>
                        <p class="stage-help">Your QR code will be generated automatically.</p>

                        <div id="content-url" class="content is-active">
                            <label for="url">URL</label>
                            <input id="url" name="url" type="url" inputmode="url" placeholder="https://example.com"
                                autocomplete="url" aria-describedby="urlError" />
                            <div id="urlError" class="error" role="alert" aria-live="polite"></div>
                        </div>

                        <div id="content-text" class="content">
                            <label for="plainText">Text</label>
                            <textarea id="plainText" rows="4" placeholder="Type any text to encode."></textarea>
                        </div>

                        <div id="content-wifi" class="content">
                            <div class="grid-2">
                                <div class="field">
                                    <label for="wifiSsid">SSID</label>
                                    <input id="wifiSsid" type="text" placeholder="Network name" />
                                </div>
                                <div class="field">
                                    <label for="wifiAuth">Encryption</label>
                                    <select id="wifiAuth">
                                        <option value="WPA" selected>WPA/WPA2</option>
                                        <option value="WEP">WEP</option>
                                        <option value="nopass">None</option>
                                    </select>
                                </div>
                            </div>
                            <div class="grid-2">
                                <div class="field">
                                    <label for="wifiPass">Password</label>
                                    <input id="wifiPass" type="text" placeholder="••••••••" />
                                </div>
                                <label class="check-row" for="wifiHidden">
                                    <span>Hidden network</span>
                                    <input id="wifiHidden" type="checkbox" />
                                </label>
                            </div>
                        </div>
                    </div>
                </section>

                <aside class="controls-panel">
                    <div class="preview-tile">
                        <div class="action-row">
                            <button id="previewCopyBtn" class="btn btn-ghost" type="button" disabled> <iconify-icon
                                    icon="tabler:copy" width="20" height="20"></iconify-icon></button>
                            <button id="previewGenerateBtn" class="btn btn-ghost" type="submit"> <iconify-icon
                                    icon="entypo:cycle" width="20" height="20"></iconify-icon></button>
                        </div>
                        <div id="qrContainer" class="qr-box" aria-label="QR preview"></div>
                    </div>

                    <div class="controls-stack">
                        <div class="grid-2 compact-grid">
                            <div class="field dark-field">
                                <label for="size">Size</label>
                                <select id="size" name="size">
                                    <option value="192">192 px</option>
                                    <option value="256" selected>256 px</option>
                                    <option value="384">384 px</option>
                                    <option value="512">512 px</option>
                                    <option value="640">640 px</option>
                                </select>
                            </div>
                            <div class="field dark-field">
                                <label for="exportScale">Export scale</label>
                                <select id="exportScale" name="exportScale">
                                    <option value="1">1x</option>
                                    <option value="2" selected>2x</option>
                                    <option value="4">4x</option>
                                    <option value="8">8x</option>
                                </select>
                            </div>
                        </div>
                        <div class="grid-2 compact-grid">
                            <div class="field dark-field">
                                <label>Foreground</label>
                                <div class="color-radio-group" id="fgColorGroup">
                                    <button type="button" class="color-none-btn" title="No color">
                                        <iconify-icon icon="maki:cross" width="14" height="14"></iconify-icon>
                                    </button>
                                    <div class="swatches" data-target="fg">
                                        <button type="button" style="--c: #8af7b8" title="Green"></button>
                                        <button type="button" style="--c: #ffffff" title="White"></button>
                                    </div>
                                    <button type="button" class="color-palette-btn active" title="Pick color">
                                        <iconify-icon icon="ic:baseline-color-lens" width="20"
                                            height="20"></iconify-icon>
                                        <input id="fg" type="color" value="#8af7b8" />
                                    </button>
                                </div>
                            </div>

                            <div class="field dark-field">
                                <label>Background</label>
                                <div class="color-radio-group" id="bgColorGroup">
                                    <button type="button" class="color-none-btn" id="bgNone" title="Transparent">
                                        <iconify-icon icon="maki:cross" width="14" height="14"></iconify-icon>
                                    </button>
                                    <div class="swatches" data-target="bg">
                                        <button type="button" style="--c: #0d1110" title="Dark"></button>
                                        <button type="button" style="--c: #101914" title="Forest"></button>
                                    </div>
                                    <button type="button" class="color-palette-btn" title="Pick color">
                                        <iconify-icon icon="ic:baseline-color-lens" width="20"
                                            height="20"></iconify-icon>
                                        <input id="bg" type="color" value="#0d1110" />
                                    </button>
                                </div>
                            </div>
                        </div>
                        <div class="action-row">
                            <div class="download-dropdown">
                                <button id="previewDownloadBtn" class="btn btn-primary" type="button" disabled>
                                    Download QR
                                    <iconify-icon icon="fluent:chevron-down-24-regular" width="16"
                                        height="16"></iconify-icon>
                                </button>
                                <div class="dropdown-menu" id="downloadMenu">
                                    <button id="previewDownloadPng" class="dropdown-item" type="button">PNG</button>
                                    <button id="previewDownloadWebp" class="dropdown-item" type="button">WebP</button>
                                    <button id="previewDownloadSvg" class="dropdown-item" type="button">SVG</button>
                                </div>
                            </div>
                            <button id="resetBtn" class="btn btn-ghost" type="button">Reset</button>
                        </div>
                    </div>

                </aside>
            </div>
        </form>
    </main>
