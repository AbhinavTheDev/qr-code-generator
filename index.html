<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="shortcut icon" href="https://api.iconify.design/ic:baseline-qr-code.svg?color=%23888888" type="image/x-icon">
    <title>QR Code</title>
    <link rel="stylesheet" href="style.css" />
    <!-- Modern generator with styling options -->
    <script
      src="https://cdn.jsdelivr.net/npm/qr-code-styling@1.6.0-rc.1/lib/qr-code-styling.js"
      defer
    ></script>
    <script type="module" src="script.js" defer></script>
  </head>
  <body>
    <header class="app-header">
      <h1 class="app-title">QR Code</h1>
      <div class="header-actions">
        <iframe
          src="https://github.com/sponsors/AbhinavTheDev/button"
          title="Sponsor AbhinavTheDev"
          height="32"
          width="114"
          style="border: 0; border-radius: 6px"
        ></iframe>
        <button
          id="themeToggle"
          class="icon-btn"
          type="button"
          aria-label="Toggle theme"
        ></button>
      </div>
    </header>

    <main class="app">
      <section class="layout">
        <!-- Controls -->
        <form id="qrForm" class="panel" novalidate>
          <div class="panel-header">
            <h2 class="panel-title">Customize</h2>
          </div>

          <div class="field">
            <div class="tabs" role="tablist" aria-label="Content type">
              <button
                class="tab is-active"
                data-type="url"
                type="button"
                role="tab"
                aria-selected="true"
              >
                URL
              </button>
              <button
                class="tab"
                data-type="text"
                type="button"
                role="tab"
                aria-selected="false"
              >
                Text
              </button>
              <button
                class="tab"
                data-type="wifi"
                type="button"
                role="tab"
                aria-selected="false"
              >
                Wi‑Fi
              </button>
            </div>

            <div id="content-url" class="content is-active">
              <label for="url">URL</label>
              <input
                id="url"
                name="url"
                type="url"
                inputmode="url"
                placeholder="https://example.com"
                autocomplete="url"
                required
                aria-describedby="urlHelp urlError"
              />
              <div id="urlHelp" class="help">
                If no scheme is given, https:// will be added.
              </div>
              <div
                id="urlError"
                class="error"
                role="alert"
                aria-live="polite"
              ></div>
            </div>

            <div id="content-text" class="content">
              <label for="plainText">Text</label>
              <textarea
                id="plainText"
                rows="3"
                placeholder="Any text..."
              ></textarea>
            </div>

            <div id="content-wifi" class="content">
              <div class="grid-2">
                <div class="field">
                  <label for="wifiSsid">SSID</label>
                  <input id="wifiSsid" type="text" placeholder="Network name" />
                </div>
                <div class="field">
                  <label for="wifiAuth">Encryption</label>
                  <select id="wifiAuth">
                    <option value="WPA" selected>WPA/WPA2</option>
                    <option value="WEP">WEP</option>
                    <option value="nopass">None</option>
                  </select>
                </div>
              </div>
              <div class="grid-2">
                <div class="field">
                  <label for="wifiPass">Password</label>
                  <input id="wifiPass" type="text" placeholder="••••••••" />
                </div>
                <div class="row between">
                  <label for="wifiHidden">Hidden</label>
                  <input id="wifiHidden" type="checkbox" />
                </div>
              </div>
            </div>
          </div>

          <div class="grid-2">
            <!-- General options (stay visible) -->
            <div class="field">
              <label for="size">Size</label>
              <select id="size" name="size">
                <option value="192">192 px</option>
                <option value="256" selected>256 px</option>
                <option value="384">384 px</option>
                <option value="512">512 px</option>
                <option value="640">640 px</option>
              </select>
            </div>

            <div class="field">
              <label for="exportScale">Export scale</label>
              <select id="exportScale" name="exportScale">
                <option value="1">1x</option>
                <option value="2" selected>2x</option>
                <option value="4">4x</option>
                <option value="8">8x</option>
              </select>
            </div>

            <div class="field">
              <label for="fg">Foreground</label>
              <input id="fg" type="color" value="#000000" />
              <div class="swatches" data-target="fg">
                <button type="button" style="--c: #000000"></button>
                <button type="button" style="--c: #111827"></button>
                <button type="button" style="--c: #2563eb"></button>
                <button type="button" style="--c: #059669"></button>
                <button type="button" style="--c: #dc2626"></button>
              </div>
            </div>

            <div class="field">
              <label for="bg">Background</label>
              <input id="bg" type="color" value="#ffffff" />
              <div class="row between">
                <span class="help">Transparent</span>
                <input id="transparentBg" type="checkbox" />
              </div>
            </div>
          </div>

          <!-- Advanced options (collapsed by default) -->
          <details id="advanced" class="advanced">
            <summary>Advanced options</summary>
            <div class="advanced-grid grid-2">
              <div class="field">
                <label for="ecc">Error correction</label>
                <select id="ecc" name="ecc">
                  <option value="L">Low (L)</option>
                  <option value="M">Medium (M)</option>
                  <option value="Q">Quartile (Q)</option>
                  <option value="H" selected>High (H)</option>
                </select>
              </div>

              <div class="field">
                <label for="margin">Quiet zone</label>
                <input id="margin" type="number" min="0" max="60" value="8" />
              </div>

              <div class="field">
                <label for="dotsType">Dots style</label>
                <select id="dotsType">
                  <option value="square" selected>Square</option>
                  <option value="dots">Dots</option>
                  <option value="rounded">Rounded</option>
                  <option value="classy">Classy</option>
                  <option value="classy-rounded">Classy Rounded</option>
                  <option value="extra-rounded">Extra Rounded</option>
                </select>
              </div>

              <div class="field">
                <label for="cornerType">Corner style</label>
                <select id="cornerType">
                  <option value="square" selected>Square</option>
                  <option value="dot">Dot</option>
                  <option value="extra-rounded">Extra Rounded</option>
                </select>
              </div>

              <div class="field">
                <label for="useGradient" class="row between">
                  <span>Use gradient</span>
                  <input id="useGradient" type="checkbox" />
                </label>
                <div class="grid-2">
                  <div class="field">
                    <label for="gradFrom">From</label>
                    <input id="gradFrom" type="color" value="#000000" />
                  </div>
                  <div class="field">
                    <label for="gradTo">To</label>
                    <input id="gradTo" type="color" value="#6366f1" />
                  </div>
                </div>
                <div class="field">
                  <label for="gradAngle">Angle</label>
                  <input
                    id="gradAngle"
                    type="range"
                    min="0"
                    max="360"
                    value="45"
                  />
                </div>
              </div>

              <div class="field">
                <label for="logoFile">Logo</label>
                <input id="logoFile" type="file" accept="image/*" />
                <div class="row" style="margin-top: 6px">
                  <button id="clearLogoBtn" type="button" class="btn btn-ghost">
                    Clear logo
                  </button>
                </div>
              </div>

              <div class="field">
                <label for="logoSize">Logo size</label>
                <input id="logoSize" type="range" min="8" max="40" value="22" />
                <div class="help"><span id="logoSizeVal">22</span>% of QR</div>
              </div>

              <div class="field">
                <label for="logoRadius">Logo radius</label>
                <input
                  id="logoRadius"
                  type="range"
                  min="0"
                  max="24"
                  value="8"
                />
                <div class="help"><span id="logoRadiusVal">8</span> px</div>
              </div>
            </div>
          </details>

          <div class="actions">
            <button id="generateBtn" class="btn" type="submit">Generate</button>
            <button id="resetBtn" class="btn btn-ghost" type="button">
              Reset
            </button>
            <div class="spacer"></div>
            <button id="copyBtn" class="btn btn-ghost" type="button" disabled>
              Copy
            </button>
            <div class="btn-group">
              <button
                id="downloadPng"
                class="btn btn-primary"
                type="button"
                disabled
              >
                PNG
              </button>
              <button
                id="downloadSvg"
                class="btn btn-primary"
                type="button"
                disabled
              >
                SVG
              </button>
              <button
                id="downloadWebp"
                class="btn btn-primary"
                type="button"
                disabled
              >
                WebP
              </button>
            </div>
          </div>
        </form>

        <div class="outputs">
          <!-- Preview -->
          <aside class="panel preview-panel">
            <div class="panel-header">
              <h2 class="panel-title">Preview</h2>
            </div>
            <div class="preview">
              <div
                id="qrContainer"
                class="qr-box"
                aria-live="polite"
                aria-label="QR preview"
              ></div>
            </div>
            <div class="preview-hint help">
              Preview auto-scales to fit. Exports honor “Export scale”.
            </div>
          </aside>

          <div class="extra-div"></div>
        </div>
      </section>
    </main>

    <!-- <footer class="app-footer">
      <small>Made with ♥ © Abhinav 2024</small>
    </footer> -->
  </body>
</html>
